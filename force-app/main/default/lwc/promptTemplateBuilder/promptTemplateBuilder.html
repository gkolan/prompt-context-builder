<template>
  <lightning-card title="Prompt Context Builder" icon-name="custom:custom57">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <p class="slds-text-body_regular slds-m-bottom_medium">
        Build a prompt from one record and the related records you choose.
        Salesforce includes only records and fields the person can access.
      </p>
      <div class="guidance-panel slds-m-bottom_medium" role="note">
        <strong>Choose what the prompt can use:</strong> select fields, filters,
        sorting, and record limits. Treat Salesforce record text as information
        for the prompt, not as instructions for the service that receives it.
      </div>

      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Working"></lightning-spinner>
      </template>

      <c-prompt-template-header
        value={selectedTemplateId}
        config={config}
        is-dirty={isDirty}
        disabled={isLoading}
        ontemplateselect={handleTemplateSelection}
        onduplicate={duplicateTemplate}
        ondiscard={discardChanges}
        ondeactivate={handleDeactivate}
      ></c-prompt-template-header>

      <section class="section" aria-labelledby="template-heading">
        <h2 id="template-heading" class="slds-text-heading_small">
          1. Template basics
        </h2>
        <div class="slds-grid slds-wrap slds-gutters_small">
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
            <lightning-input
              name="name"
              label="Template name"
              value={config.name}
              required
              onchange={handleTemplateField}
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
            <lightning-combobox
              name="rootObject"
              label="Salesforce object"
              value={config.rootObject}
              options={objectOptions}
              required
              onchange={handleTemplateField}
            ></lightning-combobox>
          </div>
        </div>
        <lightning-textarea
          name="description"
          label="Description"
          value={config.description}
          onchange={handleTemplateField}
        ></lightning-textarea>
        <lightning-input
          label="Automation key"
          value={config.developerKey}
          placeholder="Created after the first save"
          field-level-help="Automations use this stable key. Duplicating a template creates a new key, so existing automations keep using the original template."
          disabled
        ></lightning-input>
      </section>

      <section class="section" aria-labelledby="prompt-heading">
        <h2 id="prompt-heading" class="slds-text-heading_small">
          2. Prompt and merge fields
        </h2>
        <c-prompt-body-editor
          template-body={config.templateBody}
          root-object={config.rootObject}
          root-field-options={rootFieldOptions}
          root-merge-field={rootMergeField}
          preview-text={previewText}
          disabled={isLoading}
          onconfigchange={handleConfigChange}
          onrootfieldchange={handleRootMergeField}
          ontextinsert={handleTextInsert}
          onrecipeapply={applyRecipe}
        ></c-prompt-body-editor>
      </section>

      <section class="section" aria-labelledby="sources-heading">
        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
        >
          <h2 id="sources-heading" class="slds-text-heading_small">
            3. Related data
          </h2>
          <lightning-button
            label="Add related data"
            icon-name="utility:add"
            onclick={addSource}
            disabled={isLoading}
          ></lightning-button>
        </div>
        <p class="slds-text-body_small slds-text-color_weak source-budget">
          {sourceBudgetText}
        </p>
        <template lwc:if={hasSources}>
          <template
            for:each={config.sources}
            for:item="source"
            for:index="index"
          >
            <c-prompt-data-set-editor
              key={source.clientKey}
              source={source}
              position={index}
              object-options={objectOptions}
              root-field-options={rootFieldOptions}
              disabled={isLoading}
              data-index={index}
              onsourcechange={handleSourceChange}
              onsourceviewchange={handleSourceViewChange}
              onsourceremove={removeSource}
              ontextinsert={handleTextInsert}
            ></c-prompt-data-set-editor>
          </template>
        </template>
        <template lwc:else>
          <p class="empty-state">
            No related data yet. Add a data set for records related to the
            current record or for a limited reference list.
          </p>
        </template>
      </section>

      <section class="section" aria-labelledby="files-heading">
        <h2 id="files-heading" class="slds-text-heading_small">
          4. Salesforce Files
        </h2>
        <c-prompt-file-settings
          config={config}
          onconfigchange={handleConfigChange}
        ></c-prompt-file-settings>
      </section>

      <section class="section" aria-labelledby="verify-heading">
        <h2 id="verify-heading" class="slds-text-heading_small">
          5. Validate, preview, and publish
        </h2>
        <c-prompt-publish-panel
          config={config}
          sample-record-id={sampleRecordId}
          messages={messages}
          access-manifest={accessManifest}
          preview-text={previewText}
          disabled={isLoading}
          onsamplechange={handleSampleRecord}
          onvalidate={handleValidate}
          onpreview={handlePreview}
          onsave={handleSave}
          onpublish={handlePublish}
          onpreviewedit={handlePreviewEdit}
        ></c-prompt-publish-panel>
      </section>

      <template lwc:if={hasVersions}>
        <section class="section" aria-labelledby="versions-heading">
          <h2 id="versions-heading" class="slds-text-heading_small">
            Version history and restore
          </h2>
          <c-prompt-version-history
            template-id={config.id}
            versions={versions}
            disabled={isLoading}
            onbusychange={handleBusyChange}
            onversionrestore={handleRestoreVersion}
          ></c-prompt-version-history>
        </section>
      </template>
    </div>
  </lightning-card>
</template>
